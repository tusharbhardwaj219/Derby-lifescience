<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found — Derby Lifescience</title>
  <meta name="description" content="The page you are looking for could not be found. Return to the Derby Lifescience home page or browse our product range." />
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#1E2821" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="icon" type="image/png" href="image/D.png" />
  <link rel="apple-touch-icon" href="image/D.png" />
  <link rel="stylesheet" href="css/style.css" />

  <style>
    .nf {
      min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 40px 22px;
      background:
        radial-gradient(120% 80% at 50% 0%, rgba(118,147,130,0.20), transparent 62%),
        linear-gradient(180deg, #f2f6f2 0%, var(--bg) 60%);
    }
    .nf__logo { width: 74px; height: 74px; object-fit: contain; margin-bottom: 26px;
      filter: drop-shadow(0 14px 26px rgba(38,50,41,0.16)); }
    .nf__code {
      font-size: clamp(72px, 16vw, 128px); font-weight: 800; line-height: 0.9; letter-spacing: -0.04em;
      background: linear-gradient(120deg, var(--pine, #1E2821), var(--primary, #769382));
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: var(--pine);
    }
    .nf__title { margin-top: 14px; font-size: clamp(22px, 4vw, 30px); font-weight: 700; letter-spacing: -0.02em; color: var(--ink); }
    .nf__text { margin-top: 12px; max-width: 440px; font-size: 15px; line-height: 1.65; color: rgba(38,50,41,0.66); }
    .nf__actions { margin-top: 30px; display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
    .nf__btn {
      display: inline-flex; align-items: center; gap: 8px; height: 48px; padding: 0 24px;
      border-radius: 999px; font-family: inherit; font-size: 14.5px; font-weight: 600; letter-spacing: -0.01em;
      text-decoration: none; border: 1.5px solid transparent; cursor: pointer;
      transition: transform 0.28s var(--ease), background 0.28s var(--ease), box-shadow 0.28s var(--ease);
    }
    .nf__btn svg { width: 17px; height: 17px; }
    .nf__btn--primary { background: var(--pine, #1E2821); color: #fff; box-shadow: 0 16px 30px -14px rgba(30,40,33,0.6); }
    .nf__btn--primary:hover { transform: translateY(-2px); box-shadow: 0 22px 40px -14px rgba(30,40,33,0.65); }
    .nf__btn--ghost { background: #fff; color: var(--pine, #1E2821); border-color: rgba(118,147,130,0.4); }
    .nf__btn--ghost:hover { background: rgba(118,147,130,0.10); transform: translateY(-2px); }
    .nf__links { margin-top: 26px; font-size: 13.5px; color: rgba(38,50,41,0.55); }
    .nf__links a { color: var(--pr-deep, #47624F); font-weight: 600; text-decoration: none; }
    .nf__links a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main class="nf">
    <img class="nf__logo" src="image/D.png" alt="Derby Lifescience" />
    <div class="nf__code">404</div>
    <h1 class="nf__title">This page could not be found</h1>
    <p class="nf__text">The link may be broken or the page may have moved. Let's get you back to something useful.</p>

    <div class="nf__actions">
      <a class="nf__btn nf__btn--primary" href="index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
        Back to Home
      </a>
      <a class="nf__btn nf__btn--ghost" href="products.html">
        Browse Products
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
      </a>
    </div>

    <p class="nf__links">Need help? <a href="contact.html">Contact our team</a></p>
  </main>
</body>
</html>
